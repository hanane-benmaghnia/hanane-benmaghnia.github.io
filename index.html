<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanane Benmaghnia</title>
  <meta name="description" content="Personal website · Page personnelle">
  <link rel="alternate" hreflang="en" href="en/index.html">
  <link rel="alternate" hreflang="fr" href="fr/index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Redirection automatique selon la langue du navigateur
    (function () {
      try {
        var saved = localStorage.getItem('lang');
        var lang = saved || ((navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
        window.location.replace(lang + '/index.html');
      } catch (e) {
        /* sans redirection : l'utilisateur choisit ci-dessous */
      }
    })();
  </script>
</head>
<body class="chooser">
  <main class="lang-choice">
    <h1>First Last ✿</h1>
    <p>Choose your language · Choisissez votre langue</p>
    <div class="lang-buttons">
      <a class="big-btn" href="en/index.html" hreflang="en" onclick="try{localStorage.setItem('lang','en')}catch(e){}">English</a>
      <a class="big-btn" href="fr/index.html" hreflang="fr" onclick="try{localStorage.setItem('lang','fr')}catch(e){}">Français</a>
    </div>
  </main>
</body>
</html>
